services:
  - type: web
    name: secureescrow-kenya
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn escrow_project.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: secureescrow-db
          property: connectionString
      - key: MPESA_TEST_MODE
        value: True

databases:
  - name: secureescrow-db
    databaseName: secureescrow
    plan: free