<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SecureEscrow Kenya - Safe Transactions{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    {% load static %}
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    {% include 'includes/navbar.html' %}
    
    <!-- Messages -->
    {% if messages %}
    <div class="messages-container">
        {% for message in messages %}
        <div class="message message-{{ message.tags }}">
            {{ message }}
            <button class="message-close">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    
    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    {% include 'includes/footer.html' %}
    
    <!-- Scripts -->
    <script src="{% static 'js/main.js' %}"></script>
    
    <!-- Mobile Menu Toggle Script (Inline to ensure it runs) -->
    <script>
        (function() {
            console.log('🔍 Inline navbar script starting...');
            
            function initMobileMenu() {
                var navToggle = document.getElementById('navToggle');
                var navMenu = document.getElementById('navMenu');
                
                console.log('Toggle found:', !!navToggle);
                console.log('Menu found:', !!navMenu);
                
                if (navToggle && navMenu) {
                    // Remove any existing click handlers
                    var newToggle = navToggle.cloneNode(true);
                    navToggle.parentNode.replaceChild(newToggle, navToggle);
                    
                    // Re-get the elements
                    navToggle = document.getElementById('navToggle');
                    navMenu = document.getElementById('navMenu');
                    
                    // Add click handler
                    navToggle.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        console.log('🟢 Hamburger clicked!');
                        
                        // Toggle classes
                        navMenu.classList.toggle('active');
                        navToggle.classList.toggle('active');
                        
                        console.log('Menu active:', navMenu.classList.contains('active'));
                        console.log('Menu classes:', navMenu.className);
                    });
                    
                    // Close menu when clicking links on mobile
                    var links = navMenu.querySelectorAll('.nav-link:not(.dropdown-toggle)');
                    links.forEach(function(link) {
                        link.addEventListener('click', function() {
                            if (window.innerWidth <= 768) {
                                navMenu.classList.remove('active');
                                navToggle.classList.remove('active');
                            }
                        });
                    });
                    
                    // Close menu when clicking outside
                    document.addEventListener('click', function(event) {
                        if (navMenu.classList.contains('active') && 
                            !navMenu.contains(event.target) && 
                            !navToggle.contains(event.target)) {
                            navMenu.classList.remove('active');
                            navToggle.classList.remove('active');
                        }
                    });
                    
                    // Handle mobile dropdowns
                    var dropdownToggles = navMenu.querySelectorAll('.dropdown-toggle');
                    dropdownToggles.forEach(function(toggle) {
                        toggle.addEventListener('click', function(e) {
                            if (window.innerWidth <= 768) {
                                e.preventDefault();
                                e.stopPropagation();
                                var dropdown = this.closest('.nav-dropdown');
                                if (dropdown) {
                                    dropdown.classList.toggle('active');
                                }
                            }
                        });
                    });
                    
                    console.log('✅ Mobile menu initialized successfully');
                } else {
                    console.error('❌ Could not find nav elements');
                }
            }
            
            // Initialize when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initMobileMenu);
            } else {
                initMobileMenu();
            }
        })();
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
